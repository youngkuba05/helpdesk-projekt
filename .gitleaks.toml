title = "TicketDesk secret scanning"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Known seeded DEV account password, used only by the isolated ticket-flow test"
condition = "AND"
regexTarget = "secret"
